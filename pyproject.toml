[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-hash-inverse"
version = "0.1.0"
description = "JSON-serialisable MD5 and SHA-256 execution traces"
requires-python = ">=3.10"
authors = [{ name = "Choi SoonWook" }]
dependencies = []

[project.scripts]
hash-trace = "diffusion_hash_inv.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
