[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-hash-inverse"
version = "0.1.0"
description = "JSON-serialisable MD5 and SHA-256 execution traces"
requires-python = ">=3.10"
authors = [{ name = "Choi SoonWook" }]
dependencies = [
    "numpy>=2.2.6",
    "torch>=2.0",
]

[project.optional-dependencies]
mlx = ["mlx>=0.32.2,<0.33; platform_system == 'Darwin' and platform_machine == 'arm64'"]

[project.scripts]
hash-inverse-v6 = "dhi_v6.study:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["metal: requires MLX Metal"]
