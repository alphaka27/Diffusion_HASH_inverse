[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-hash-inverse"
version = "0.1.0"
description = "JSON-serialisable MD5 and SHA-256 execution traces"
requires-python = ">=3.10"
authors = [{ name = "Choi SoonWook" }]
dependencies = [
    "numpy>=2.2.6",
    "torch>=2.0",
]

[project.optional-dependencies]
mlx = ["mlx>=0.32.2,<0.33; platform_system == 'Darwin' and platform_machine == 'arm64'"]

[project.scripts]
hash-trace = "diffusion_hash_inv.cli:main"
hash-inverse-experiment = "diffusion_hash_inv.experiment_cli:main"
hash-inverse-validate = "diffusion_hash_inv.validation_cli:main"
hash-inverse-g1 = "diffusion_hash_inv.positive_control:main"
hash-inverse-study = "diffusion_hash_inv.study_cli:main"
hash-inverse-v4 = "diffusion_hash_inv.study_v4:main"
hash-inverse-v5 = "dhi_v5.study:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
